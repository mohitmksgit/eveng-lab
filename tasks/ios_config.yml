---
- name: Configure Management Interface
  cisco.ios.ios_config:
    lines:
      - "ip address {{ mgmt_ip }} {{ mgmt_mask }}"
      - "no shutdown"
    parents: "interface {{ mgmt_interface }}"
  vars:
    mgmt_ip: "{{ mgmt_ips[inventory_hostname] }}"
    mgmt_mask: "255.255.255.0"
    mgmt_interface: >-
      {%- if inventory_hostname in groups['cisco_nxos'] -%}
      mgmt0
      {%- else -%}
      ethernet0/0
      {%- endif -%}

- name: Configure Default Route for Management
  cisco.ios.ios_config:
    lines:
      - "ip route 0.0.0.0 0.0.0.0 {{ mgmt_gateway }}"
    match: none

# ISP Router Configuration
- name: Configure ISP Router
  cisco.ios.ios_config:
    src: "templates/isp_router.j2"
  when: inventory_hostname == 'ISP_ROUTER'

